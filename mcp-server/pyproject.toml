[project]
name = "ybase-mcp"
version = "0.1.0"
description = "MCP server exposing YBase company memory to AI agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
ybase-mcp = "ybase_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ybase_mcp"]

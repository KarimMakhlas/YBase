# Fly.io deploy config. The Dockerfile builds the UI and serves it from the
# FastAPI backend, so this is the whole app in one machine.
#
#   fly launch --no-deploy            # create the app (edit the name below first)
#   fly secrets set DATABASE_URL=... ANTHROPIC_API_KEY=... CONNECTOR_SECRET_KEY=...
#   fly deploy
#
# DATABASE_URL must point at a Postgres with the pgvector extension available
# (recent Fly Postgres, Supabase, or Neon all qualify) — see DEPLOY-neon.md.

app = "ybase"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Non-secret config. Secrets (DATABASE_URL, ANTHROPIC_API_KEY, CONNECTOR_SECRET_KEY,
# VOYAGE_API_KEY, SLACK_*, JIRA_*, GITHUB_*, RESEND_API_KEY) go in `fly secrets`.
#
# Multi-instance: before raising machine count above 1, set a REDIS_URL secret
# (`fly redis create` / Upstash — same region as primary_region) so instances
# coordinate per-workspace formation locks, ticker leadership, and shared rate
# limits. The Redis MUST run maxmemory-policy=noeviction: an evicted workspace
# lock would let two instances form the same workspace concurrently. Also mind
# DB_POOL_MAX_SIZE (default 20) × instance count vs your Postgres plan's
# connection ceiling. A single machine needs no Redis at all.
[env]
  STATIC_DIR = "/srv/static"
  SESSION_COOKIE_SECURE = "true"
  LLM_PROVIDER = "anthropic"
  EMBED_PROVIDER = "auto"
  ALLOW_PUBLIC_SIGNUP = "true"
  SEED_DEMO_ON_SIGNUP = "true"
  # Set these to the deployed URL once you know it (used for OAuth callbacks,
  # invite/digest links, and secure cookies):
  #   APP_BASE_URL, SLACK_REDIRECT_BASE_URL, JIRA_REDIRECT_BASE_URL,
  #   GITHUB_REDIRECT_BASE_URL, CORS_ORIGINS

[http_service]
  internal_port = 8100
  force_https = true
  # Keep the machine warm: auto-stop made the first request after an idle period
  # pay a 10-25s cold start (container boot + Python import + pool init + worker
  # start + schema/migrations). With one paying customer that is a blank screen
  # on first load. Always-on is worth the few dollars/month pre-scale.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 512MB OOM-killed under concurrent formation (3 workers each holding a full
  # document + embedding arrays) plus SSE query streams. Neon offloads the DB
  # itself, but the app still buffers documents in memory during formation.
  memory_mb = 2048

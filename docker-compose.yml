services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ybase-db
    environment:
      POSTGRES_USER: ybase
      POSTGRES_PASSWORD: ybase
      POSTGRES_DB: ybase
    ports:
      - "5433:5432"
    volumes:
      - ybase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ybase -d ybase"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Optional cross-instance coordination (multi-instance formation locks,
  # leader election, shared rate limits). The app runs fine without it —
  # empty REDIS_URL means single-instance mode. noeviction is required: an
  # evicted workspace lock would let two instances form the same workspace.
  redis:
    image: redis:7-alpine
    container_name: ybase-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Full stack (backend + built UI) in one container:
  #   docker compose --profile app up -d --build       → http://localhost:8100
  # Plain `docker compose up -d` still starts only the database for local dev.
  app:
    build: .
    container_name: ybase-app
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgresql://ybase:ybase@db:5432/ybase
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-openai/gpt-oss-120b}
      NVIDIA_MAX_TOKENS: ${NVIDIA_MAX_TOKENS:-4096}
      NVIDIA_TEMPERATURE: ${NVIDIA_TEMPERATURE:-1}
      NVIDIA_TOP_P: ${NVIDIA_TOP_P:-1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-auto}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DIGEST_FROM_EMAIL: ${DIGEST_FROM_EMAIL:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_REDIRECT_BASE_URL: ${SLACK_REDIRECT_BASE_URL:-http://localhost:8100}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_BASE_URL: ${GITHUB_REDIRECT_BASE_URL:-http://localhost:8100}
      JIRA_CLIENT_ID: ${JIRA_CLIENT_ID:-}
      JIRA_CLIENT_SECRET: ${JIRA_CLIENT_SECRET:-}
      JIRA_REDIRECT_BASE_URL: ${JIRA_REDIRECT_BASE_URL:-http://localhost:8100}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      LINEAR_REDIRECT_BASE_URL: ${LINEAR_REDIRECT_BASE_URL:-http://localhost:8100}
      CONFLUENCE_CLIENT_ID: ${CONFLUENCE_CLIENT_ID:-}
      CONFLUENCE_CLIENT_SECRET: ${CONFLUENCE_CLIENT_SECRET:-}
      CONFLUENCE_REDIRECT_BASE_URL: ${CONFLUENCE_REDIRECT_BASE_URL:-http://localhost:8100}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_REDIRECT_BASE_URL: ${DISCORD_REDIRECT_BASE_URL:-http://localhost:8100}
      GOOGLE_DOCS_CLIENT_ID: ${GOOGLE_DOCS_CLIENT_ID:-}
      GOOGLE_DOCS_CLIENT_SECRET: ${GOOGLE_DOCS_CLIENT_SECRET:-}
      GOOGLE_DOCS_REDIRECT_BASE_URL: ${GOOGLE_DOCS_REDIRECT_BASE_URL:-http://localhost:8100}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      NOTION_REDIRECT_BASE_URL: ${NOTION_REDIRECT_BASE_URL:-http://localhost:8100}
      FIGMA_CLIENT_ID: ${FIGMA_CLIENT_ID:-}
      FIGMA_CLIENT_SECRET: ${FIGMA_CLIENT_SECRET:-}
      FIGMA_REDIRECT_BASE_URL: ${FIGMA_REDIRECT_BASE_URL:-http://localhost:8100}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_BASE_URL: ${GOOGLE_REDIRECT_BASE_URL:-http://localhost:8100}
      CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ybase_pgdata:

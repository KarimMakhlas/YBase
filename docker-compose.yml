services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ybase-db
    environment:
      POSTGRES_USER: ybase
      POSTGRES_PASSWORD: ybase
      POSTGRES_DB: ybase
    ports:
      - "5433:5432"
    volumes:
      - ybase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ybase -d ybase"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Full stack (backend + built UI) in one container:
  #   docker compose --profile app up -d --build       → http://localhost:8100
  # Plain `docker compose up -d` still starts only the database for local dev.
  app:
    build: .
    container_name: ybase-app
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgresql://ybase:ybase@db:5432/ybase
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-openai/gpt-oss-120b}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_REDIRECT_BASE_URL: ${SLACK_REDIRECT_BASE_URL:-http://localhost:8100}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_BASE_URL: ${GITHUB_REDIRECT_BASE_URL:-http://localhost:8100}
      JIRA_CLIENT_ID: ${JIRA_CLIENT_ID:-}
      JIRA_CLIENT_SECRET: ${JIRA_CLIENT_SECRET:-}
      JIRA_REDIRECT_BASE_URL: ${JIRA_REDIRECT_BASE_URL:-http://localhost:8100}
      CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ybase_pgdata:

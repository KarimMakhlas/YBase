name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ybase
          POSTGRES_PASSWORD: ybase
          POSTGRES_DB: ybase
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ybase -d ybase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://ybase:ybase@localhost:5433/ybase_test
      EMBED_PROVIDER: local
      LLM_PROVIDER: ollama

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match the Dockerfile's base image — testing on a different
          # minor than the one that ships is how version-specific bugs reach
          # production untested.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: PYTHONPATH=backend python -m pytest backend/tests

      - name: Gate tenant ANN recall
        run: PYTHONPATH=backend python scripts/ci_retrieval_gate.py --documents 16 --k 5 --min-recall 0.95

      # Lint is advisory for now: it was added to a codebase that had never run
      # one, so it reports rather than gates. Tighten to blocking once the
      # existing backlog is cleared.
      - name: Lint backend (advisory)
        continue-on-error: true
        run: python -m ruff check backend mcp-server scripts

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (advisory)
        continue-on-error: true
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
